name: Post-deploy tripwire

# After each push to main (Vercel deploys production), watch production.
# On an error spike or failing core pages, revert the pushed commits with
# a revert PR, merge it (Vercel redeploys the previous code), and open an
# issue with the evidence. See DEPLOYMENT.md "Post-deploy tripwire".
#
# Needs (repo settings):
#   - Secret HEALTH_TOKEN (same value as the Vercel env var) to read
#     server error counts. Without it the tripwire watches probes only.
#   - Settings > Actions > General > "Allow GitHub Actions to create and
#     approve pull requests" so the revert PR can be opened.
#   - Optional variable PROD_URL (default https://dynastygeneral.app).
#   - Optional variable TRIPWIRE_AUTO_MERGE=false to open the revert PR
#     without merging it.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Manual runs always watch and report only; they never revert"
        type: boolean
        default: true

concurrency:
  group: post-deploy-tripwire
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  watch:
    # A tripwire revert must not watch (and revert) itself.
    if: "!contains(github.event.head_commit.message, '[tripwire-revert]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Watch production
        id: watch
        run: node scripts/ops/post-deploy-tripwire.mjs
        env:
          PROD_URL: ${{ vars.PROD_URL || 'https://dynastygeneral.app' }}
          TARGET_SHA: ${{ github.sha }}
          PREVIOUS_SHA: ${{ github.event.before }}
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}

      - name: Revert the deploy
        if: steps.watch.outputs.result == 'trip' && github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          SUMMARY: ${{ steps.watch.outputs.summary }}
          AUTO_MERGE: ${{ vars.TRIPWIRE_AUTO_MERGE || 'true' }}
        run: |
          set -euo pipefail
          short="${AFTER:0:7}"
          branch="tripwire/revert-${short}"
          git config user.name "dg-tripwire[bot]"
          git config user.email "tripwire@users.noreply.github.com"
          git checkout -b "$branch" "$AFTER"
          git revert --no-commit "${BEFORE}..${AFTER}"
          git commit -m "Revert ${short}: post-deploy tripwire [tripwire-revert]" -m "$SUMMARY"
          git push origin "$branch"
          body=$(printf 'The post-deploy tripwire reverted %s.\n\n```\n%s\n```\n\nRun: %s/%s/actions/runs/%s\n\nTo re-ship: fix forward on a new branch, then open a new PR.' "$AFTER" "$SUMMARY" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          pr_url=$(gh pr create --base main --head "$branch" --title "Revert ${short}: post-deploy tripwire" --body "$body")
          echo "PR: $pr_url"
          merged="no"
          if [ "$AUTO_MERGE" = "true" ]; then
            if gh pr merge "$pr_url" --squash --subject "Revert ${short}: post-deploy tripwire [tripwire-revert]"; then
              merged="yes"
            fi
          fi
          issue_body="$(printf '%s\n\nRevert PR: %s (merged: %s)\n\nIf merged is no, merge the revert PR or promote the previous deploy in Vercel (Deployments > previous > Promote).' "$body" "$pr_url" "$merged")"
          # Charter: tripwires notify the founder the same day as an `interrupt` issue.
          gh issue create --title "Tripwire fired on ${short}" --label interrupt --assignee "$GITHUB_REPOSITORY_OWNER" --body "$issue_body" \
            || gh issue create --title "Tripwire fired on ${short}" --body "$issue_body" || true

      - name: Report without reverting
        if: steps.watch.outputs.result != 'ok' && (steps.watch.outputs.result != 'trip' || github.event_name != 'push')
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.watch.outputs.result }}
          SUMMARY: ${{ steps.watch.outputs.summary }}
        run: |
          echo "Result: $RESULT"
          echo "$SUMMARY"
          if [ "$RESULT" = "trip" ] || [ "$RESULT" = "not_live" ] || [ "$RESULT" = "error" ]; then
            issue_body="$(printf '%s\n\nRun: %s/%s/actions/runs/%s' "$SUMMARY" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
            gh issue create --title "Tripwire: ${RESULT} on ${GITHUB_SHA:0:7}" --label interrupt --assignee "$GITHUB_REPOSITORY_OWNER" --body "$issue_body" \
              || gh issue create --title "Tripwire: ${RESULT} on ${GITHUB_SHA:0:7}" --body "$issue_body" || true
          fi
